language = "C"
include_guard = "MFSK_FFI_H"
pragma_once = true
cpp_compat = true
tab_width = 4
documentation_style = "doxy"
autogen_warning = "/* Generated by cbindgen — do not edit. */"

# Export/visibility, which this header had none of. Without
# `__declspec` a Windows DLL exports nothing a consumer can link
# against, and without the visibility attribute a Unix shared object
# exports every non-static symbol — including Rust internals — which
# is both larger and a slower dynamic link.
#
# `MFSK_API` is emitted on every function via `[fn] prefix` below.
# Define `MFSK_STATIC` when linking the static library, or
# `MFSK_BUILDING` when building the DLL itself.
#
# The calling convention is `extern "C"`'s own, which is `__cdecl` on
# Windows for every signature here. It is stated rather than emitted:
# cbindgen can place a prefix before the return type but not the
# `__cdecl` position between the return type and the name, and
# inventing a macro that cannot be put where MSVC needs it would be
# worse than documenting the default.
after_includes = """
#ifndef MFSK_API
#if defined(_WIN32) || defined(__CYGWIN__)
#  if defined(MFSK_STATIC)
#    define MFSK_API
#  elif defined(MFSK_BUILDING)
#    define MFSK_API __declspec(dllexport)
#  else
#    define MFSK_API __declspec(dllimport)
#  endif
#elif defined(__GNUC__) || defined(__clang__)
#  define MFSK_API __attribute__((visibility(\"default\")))
#else
#  define MFSK_API
#endif
#endif  /* MFSK_API */
"""

[export]
prefix = ""

[export.rename]
# Public items already use the Mfsk* / mfsk_ prefix.

[fn]
args = "vertical"
prefix = "MFSK_API"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

# parse_deps + a tight include allow-list: mfsk-ffi-abi's shared
# MfskStatus/MfskResult/MfskResultList/MfskDecodeOptions/MfskDecodeDepth
# (issue #205) are only `pub use`-re-exported here, not defined in this
# crate — cbindgen must cross the crate boundary to see their real
# definitions, or it silently emits function signatures referencing
# types it never `typedef`s. Restricted to mfsk-ffi-abi (not `true`
# alone) so mfsk-core's much larger dependency tree is never parsed.
[parse]
parse_deps = true
include = ["mfsk-ffi-abi"]
